name: recovery-app

# Builds the native "fpvOS Recovery" apps the web flasher offers on macOS and
# Windows — the OSes whose browsers can't drive the stock bootloader over WebHID
# (see the flasher's prepare-support.js). Publishes them as the release assets the page links
# at releases/latest/download/:
#   fpvOS-Recovery-macOS.zip     "fpvOS Recovery.app" with libusb vendored in
#   fpvOS-recovery-win.zip       "fpvOS Recovery.exe", self-contained (libusb and
#                                the WinUSB helper inside), plus license texts
#
# Run it by pushing a tag like `recovery-app-v0.4.5`, or by hand (workflow_dispatch,
# which cuts a prerelease that does NOT become releases/latest). A tag with a
# hyphen after the version is a prerelease too, named by the commit it builds
# (`recovery-app-v0.5.0-<commit>`, Cargo.toml's version 0.5.0-<commit>): the
# flasher's preview page links it by its tag, the live page keeps the latest,
# and the app itself hands off to /preview/ (src/engine.rs FLASHER_URL). Signing is
# optional and runs only when the repo has the secrets below; without them the
# apps are unsigned and the user accepts the one-time "unidentified developer"
# prompt.
#
# Optional signing secrets (all-or-nothing per platform):
#   MACOS_CERT_P12            base64 of a Developer ID Application .p12
#   MACOS_CERT_PASSWORD       its password
#   MACOS_SIGN_IDENTITY       e.g. "Developer ID Application: Name (TEAMID)"
#   MACOS_NOTARY_APPLE_ID / MACOS_NOTARY_PASSWORD / MACOS_NOTARY_TEAM_ID
#                             notarytool credentials (app-specific password)
#   WINDOWS_CERT_PFX          base64 of an Authenticode .pfx
#   WINDOWS_CERT_PASSWORD     its password

on:
  push:
    tags: ['recovery-app-v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_DIR: .

jobs:
  macos:
    runs-on: macos-latest   # Apple Silicon: the app is arm64-only
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain and libusb
        run: |
          rustup update stable --no-self-update
          rustup default stable
          brew list libusb >/dev/null 2>&1 || brew install libusb
      - name: Build
        run: cargo build --release --locked --manifest-path "$APP_DIR/Cargo.toml"
      - name: Bundle fpvOS Recovery.app (libusb vendored)
        run: |
          set -eux
          VER=$(sed -n 's/^version = "\(.*\)"/\1/p' "$APP_DIR/Cargo.toml" | head -1)
          BIN="$APP_DIR/target/release/fpvos-recovery"
          APP="fpvOS Recovery.app"
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Frameworks" "$APP/Contents/Resources"
          cp "$BIN" "$APP/Contents/MacOS/fpvos-recovery"
          sed "s/__VERSION__/$VER/g" "$APP_DIR/packaging/Info.plist" > "$APP/Contents/Info.plist"
          cp "$APP_DIR/packaging/AppIcon.icns" "$APP/Contents/Resources/AppIcon.icns"
          cp "$APP_DIR/LICENSE" "$APP/Contents/Resources/LICENSE.txt"
          cp "$(brew --prefix libusb)/COPYING" "$APP/Contents/Resources/LICENSE-libusb.txt"
          # Vendor the libusb dylib and repoint the binary's absolute Homebrew
          # load path at the copy inside the bundle, so it runs with no Homebrew.
          DYLIB=$(otool -L "$APP/Contents/MacOS/fpvos-recovery" | awk '/libusb-1\.0/{print $1; exit}')
          test -n "$DYLIB"
          REAL=$(python3 -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "$DYLIB")
          cp "$REAL" "$APP/Contents/Frameworks/libusb-1.0.0.dylib"
          chmod 644 "$APP/Contents/Frameworks/libusb-1.0.0.dylib"
          install_name_tool -id "@executable_path/../Frameworks/libusb-1.0.0.dylib" \
            "$APP/Contents/Frameworks/libusb-1.0.0.dylib"
          install_name_tool -change "$DYLIB" "@executable_path/../Frameworks/libusb-1.0.0.dylib" \
            "$APP/Contents/MacOS/fpvos-recovery"
          otool -L "$APP/Contents/MacOS/fpvos-recovery"
          # Rewriting the Mach-O invalidated its (ad-hoc) signature, and arm64
          # won't launch an invalidly signed binary — ad-hoc re-sign. Developer
          # ID signing in the next step supersedes this when it's configured.
          codesign --force --sign - "$APP/Contents/Frameworks/libusb-1.0.0.dylib"
          codesign --force --sign - "$APP"
          codesign --verify --strict "$APP"
      - name: Sign and notarize (only when the macOS secrets are set)
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: |
          set -eu
          APP="fpvOS Recovery.app"
          if [ -z "${CERT_P12:-}" ] || [ -z "${SIGN_IDENTITY:-}" ]; then
            echo "No macOS signing secrets — shipping the app unsigned."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p actions "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p actions "$KEYCHAIN"
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "${CERT_PASSWORD:-}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          # Sign inside-out: the vendored dylib first, then the bundle.
          codesign --force --options runtime --timestamp \
            --sign "$SIGN_IDENTITY" "$APP/Contents/Frameworks/libusb-1.0.0.dylib"
          codesign --force --options runtime --timestamp \
            --sign "$SIGN_IDENTITY" "$APP"
          codesign --verify --strict --verbose=2 "$APP"
          if [ -n "${NOTARY_APPLE_ID:-}" ] && [ -n "${NOTARY_PASSWORD:-}" ] && [ -n "${NOTARY_TEAM_ID:-}" ]; then
            ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
            xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
              --apple-id "$NOTARY_APPLE_ID" --password "$NOTARY_PASSWORD" --team-id "$NOTARY_TEAM_ID" --wait
            xcrun stapler staple "$APP"
          else
            echo "Signed but not notarized (no notary credentials set)."
          fi
      - name: Zip
        run: ditto -c -k --keepParent "fpvOS Recovery.app" fpvOS-Recovery-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: fpvOS-Recovery-macOS.zip
          if-no-files-found: error

  # fpvos-winusb.exe: the libwdi helper the Windows app runs (elevated) to bind
  # WinUSB to the bootloader. Cross-built with MinGW-w64; see
  # windows/build-winusb-helper.sh.
  winusb-helper:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64
      - name: Build
        run: CC=x86_64-w64-mingw32-gcc-posix "$APP_DIR/windows/build-winusb-helper.sh"
      - uses: actions/upload-artifact@v4
        with:
          name: winusb-helper
          path: |
            ${{ env.APP_DIR }}/windows/out/fpvos-winusb.exe
            ${{ env.APP_DIR }}/windows/libwdi/COPYING-LGPL
          if-no-files-found: error

  windows:
    needs: [winusb-helper]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: winusb-helper
          path: winusb-helper
      - name: Toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable-x86_64-pc-windows-msvc
      - name: libusb (vcpkg, fully static, as the app links its C runtime in)
        shell: bash
        run: |
          vcpkg install libusb:x64-windows-static
          echo "LIBUSB_LIB_DIR=$VCPKG_INSTALLATION_ROOT/installed/x64-windows-static/lib" >> "$GITHUB_ENV"
      # The helper is embedded in the app and run elevated, so it is signed
      # before the build embeds it; the app itself is signed after.
      - name: Sign (only when the Windows secret is set)
        id: sign
        shell: pwsh
        env:
          CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $helper = (Get-ChildItem -Recurse winusb-helper -Filter fpvos-winusb.exe | Select-Object -First 1).FullName
          "FPVOS_WINUSB_HELPER=$helper" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          if (-not $env:CERT_PFX) { Write-Host "No Windows signing secret — shipping unsigned."; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_PFX))
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName | Select-Object -Last 1).FullName
          "SIGNTOOL=$signtool" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "PFX=$pfx" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          & $signtool sign /f $pfx /p $env:CERT_PASSWORD /fd SHA256 `
            /tr http://timestamp.digicert.com /td SHA256 $helper
      - name: "Build (libusb and the helper inside: one self-contained exe)"
        run: cargo build --release --locked --manifest-path "$env:APP_DIR/Cargo.toml"
      - name: Sign the app
        shell: pwsh
        env:
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:SIGNTOOL) { exit 0 }
          & $env:SIGNTOOL sign /f $env:PFX /p $env:CERT_PASSWORD /fd SHA256 `
            /tr http://timestamp.digicert.com /td SHA256 "$env:APP_DIR\target\release\fpvos-recovery.exe"
      - name: Stage
        shell: bash
        run: |
          set -eux
          mkdir -p stage
          cp "$APP_DIR/target/release/fpvos-recovery.exe" "stage/fpvOS Recovery.exe"
          cp "$APP_DIR/LICENSE" stage/LICENSE.txt
          cp "$(find winusb-helper -name COPYING-LGPL)" stage/LICENSE-libwdi.txt
          cp "$VCPKG_INSTALLATION_ROOT/installed/x64-windows-static/share/libusb/copyright" stage/LICENSE-libusb.txt
      - name: Zip
        shell: pwsh
        run: |
          Compress-Archive -Path stage\* -DestinationPath "fpvOS-recovery-win.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: fpvOS-recovery-win.zip
          if-no-files-found: error

  release:
    needs: [macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
          IS_TAG: ${{ github.ref_type == 'tag' }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('recovery-app-dev-{0}', github.run_number) }}
        run: |
          set -eux
          ls -R dist
          FLAGS=""
          # a run by hand, or a tag with a suffix (recovery-app-v0.5.0-alpha1):
          # a prerelease, never releases/latest
          case "$IS_TAG:$TAG" in true:recovery-app-v*-*|false:*) FLAGS="--prerelease" ;; esac
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "fpvOS Recovery $TAG" $FLAGS \
              --notes "Native recovery apps for the one-time stock→fpvOS step on macOS and Windows. The web flasher links these at releases/latest/download/."
          fi
          gh release upload "$TAG" dist/fpvOS-Recovery-macOS.zip dist/fpvOS-recovery-win.zip --clobber
